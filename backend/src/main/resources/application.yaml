spring:
  application:
    name: strengthcoach

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/setforge_db}
    username: ${DB_USERNAME:setforge_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

setforge:
  cors:
    allowed-origins: ${SETFORGE_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
