spring:
  application:
    name: strengthcoach

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/setforge_db}
    username: ${DB_USERNAME:setforge_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://figeagihcvuxzwautxgc.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://figeagihcvuxzwautxgc.supabase.co/auth/v1/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.fazariadis.strengthcoach: ${SETFORGE_LOG_LEVEL:INFO}

setforge:
  auth:
    audience: ${SUPABASE_AUDIENCE:authenticated}
  supabase:
    url: ${SUPABASE_URL:https://figeagihcvuxzwautxgc.supabase.co}
    admin-key: ${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SECRET_KEY:}}
  cors:
    allowed-origins: ${SETFORGE_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
